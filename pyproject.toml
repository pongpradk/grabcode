[project]
name = "grabcode"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pongpradk", email = "pongpradk@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
grabcode = "grabcode:main"

[build-system]
requires = ["uv_build>=0.8.20,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
